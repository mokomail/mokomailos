name: Build MokomailOS ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "iso/**"
      - ".github/workflows/build-iso.yml"

concurrency:
  group: iso-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo docker image prune -af || true
          df -h /

      - name: Build ISO (Debian 13 container)
        run: |
          docker run --privileged --rm \
            -v "$GITHUB_WORKSPACE/iso:/build" \
            -w /build \
            debian:13 \
            bash -c "
              set -e
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends live-build
              bash auto/config
              bash auto/build
            " 2>&1 | tee /tmp/build.log

      - name: Build log tail (on failure)
        if: failure()
        run: |
          echo '### Последние строки сборки' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 200 /tmp/build.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Show result
        run: ls -lh iso/*.iso

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: mokomailos-iso
          path: iso/*.iso
          retention-days: 14
          if-no-files-found: error
